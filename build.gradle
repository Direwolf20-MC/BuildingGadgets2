plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.165'
    id "me.modmuss50.mod-publish-plugin" version "2.2.1"
}

version = computeModVersion()
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
        vendor.set(JvmVendorSpec.JETBRAINS)
    }
}

minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

runs {
    configureEach { net.neoforged.gradle.dsl.common.runs.run.Run run ->
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
//        if (run.project.javaToolchains.launcherFor(java.toolchain).map { it.metadata.vendor }.getOrElse("").contains("JetBrains")) {
//            run.jvmArgument("-XX:+AllowEnhancedClassRedefinition")
//        }
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        arguments.addAll '--username', 'Direwolf20'
    }

    client2 {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        runType('client')
        arguments.addAll '--username', 'Direwolf21'
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()

    maven { //Patchouli && JEI
        url 'https://maven.blamejared.com'
        content {
            includeGroup "vazkii.patchouli"
            includeGroup "mezz.jei"
        }
    }

    maven { // mek
        url = 'https://modmaven.dev/'
        content {
            includeGroup "mekanism"
            includeGroup "appeng"
        }
    }

    maven {
        url = uri("https://maven.theillusivec4.top/")
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }

    maven { url = "https://www.cursemaven.com" }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    //AE2
    compileOnly "appeng:appliedenergistics2:${ae2_version}:api"
    runtimeOnly "appeng:appliedenergistics2:${ae2_version}"

    //Curios
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    compileOnly "mezz.jei:jei-${jei_mc_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_mc_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${jei_mc_version}-neoforge:${jei_version}"

    //Patchouli
    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}:api"
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
}


tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: project.version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

publishMods {
    def token = providers.environmentVariable("CURSE_TOKEN");
    dryRun = !token.isPresent()
    changelog = createChangelog()
    version = project.version
    type = STABLE

    curseforge {
        projectId = "298187"
        accessToken = token.getOrElse("")
        file = project.provider { tasks.jar }.flatMap { it.archiveFile }
        displayName = "Building Gadgets 2 ${project.version}"
        modLoaders.add("neoforge")
        minecraftVersions.add("${minecraft_version}")
        javaVersions.add(JavaVersion.VERSION_21)
        client = true
        server = true
    }
}

def createChangelog() {
    def issueNumberPattern = ~/(?i)(?<!\S)#[0-9]+(?!\S)/
    def githubMentionPattern = ~/(?i)(?<!\S)@([a-zA-Z0-9-_]+)(?!\S)/

    def github = "https://github.com"
    def repo = "$github/direwolf20-mc/buildinggadgets2"

    def changelogFile = file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        throw new GradleException("CHANGELOG.md file not found!")
    }

    def changelogContent = changelogFile.text
    def output = ""

    def reading = false
    def lines = changelogContent.readLines()
    for (line in lines) {
        if (line.startsWith("## ") && line.contains(project.version)) {
            println("Found changelog for version ${project.version}")
            reading = true
            continue
        } else if (line.startsWith("## ") && reading) {
            break
        } else if (!reading) {
            continue
        }

        // Inject issues and mentions links
        line = line.replaceAll(issueNumberPattern) { fullMatch ->
            def issueNumber = fullMatch.substring(1)
            "[#${issueNumber}](${repo}/issues/${issueNumber})"
        }

        line = line.replaceAll(githubMentionPattern) { fullMatch, username ->
            "[@${username}](${github}/${username})"
        }

        output += line + "\n"
    }

    def finalOutput = output.trim();
    return finalOutput.isEmpty() ? "No changelog available." : finalOutput
}

def computeModVersion() {
    def modVersions = project.mod_version
    def mcVersion = project.minecraft_version
    def parts = mcVersion.split("\\.")

    // If it's a pre 26 version, we only take [1] + [2] (if present, otherwise 0)
    if (parts[0] == "1") {
        return "${parts[1]}.${parts.length > 2 ? parts[2] : 0}.${modVersions}"
    }

    // For 26+ versions, we take [0] + [1] + [2] (if present, otherwise 0)
    return "${parts[0]}.${parts[1]}.${parts.length > 2 ? parts[2] : 0}.${modVersions}"
}
