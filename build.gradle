plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    id "me.modmuss50.mod-publish-plugin" version "2.2.1"
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = computeModVersion()
group = mod_group_id

base {
    archivesName = mod_id
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
        vendor.set(JvmVendorSpec.JETBRAINS)
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientAuthed {
            client()
            devLogin = true
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    mavenLocal()

    // Third-party mod repositories — disabled while porting to 26.1.
    // Re-enable alongside the matching dependencies block below.
    //
    maven { //JEI
        url 'https://maven.blamejared.com'
        content {
            includeGroup "mezz.jei"
        }
    }

    maven {
        url = 'https://modmaven.dev/'
        content {
            includeGroup "appeng"
        }
    }

    maven {
        url = uri("https://maven.theillusivec4.top/")
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }

    maven { url = "https://www.cursemaven.com" }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Third-party mod integrations — disabled while porting to 26.1.
    // Re-enable one at a time after the base mod compiles against vanilla NeoForge.
    //
    ////AE2
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}:api"
    runtimeOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    //
    // Curios — sourced from CurseForge (CurseMaven). project id 309927.
    // Bump file id in gradle.properties (curios_file_id) when updating.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    //
    // JEI — API at compile time, full mod at runtime
    compileOnly "mezz.jei:jei-${jei_mc_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_mc_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${jei_mc_version}-neoforge:${jei_version}"
    //
    ////Patchouli
    //compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}:api"
    //runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: project.version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishMods {
    def token = providers.environmentVariable("CURSE_TOKEN");
    dryRun = !token.isPresent()
    changelog = providers.provider { createChangelog() }
    version = project.version
    type = STABLE

    curseforge {
        projectId = "298187"
        accessToken = token.getOrElse("")
        file = project.provider { tasks.jar }.flatMap { it.archiveFile }
        displayName = "Building Gadgets 2 ${project.version}"
        modLoaders.add("neoforge")
        minecraftVersions.add("${minecraft_version}")
        javaVersions.add(JavaVersion.VERSION_25)
        client = true
        server = true
    }
}

def createChangelog() {
    def issueNumberPattern = ~/(?i)(?<!\S)#[0-9]+(?!\S)/
    def githubMentionPattern = ~/(?i)(?<!\S)@([a-zA-Z0-9-_]+)(?!\S)/

    def github = "https://github.com"
    def repo = "$github/direwolf20-mc/buildinggadgets2"

    def changelogFile = file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        throw new GradleException("CHANGELOG.md file not found!")
    }

    def changelogContent = changelogFile.text
    def output = ""

    def reading = false
    def lines = changelogContent.readLines()
    for (line in lines) {
        if (line.startsWith("## ") && line.contains(project.version)) {
            println("Found changelog for version ${project.version}")
            reading = true
            continue
        } else if (line.startsWith("## ") && reading) {
            break
        } else if (!reading) {
            continue
        }

        // Inject issues and mentions links
        line = line.replaceAll(issueNumberPattern) { fullMatch ->
            def issueNumber = fullMatch.substring(1)
            "[#${issueNumber}](${repo}/issues/${issueNumber})"
        }

        line = line.replaceAll(githubMentionPattern) { fullMatch, username ->
            "[@${username}](${github}/${username})"
        }

        output += line + "\n"
    }

    def finalOutput = output.trim();
    return finalOutput.isEmpty() ? "No changelog available." : finalOutput
}

def computeModVersion() {
    def modVersions = project.mod_version
    def mcVersion = project.minecraft_version
    def parts = mcVersion.split("\\.")

    // If it's a pre 26 version, we only take [1] + [2] (if present, otherwise 0)
    if (parts[0] == "1") {
        return "${parts[1]}.${parts.length > 2 ? parts[2] : 0}.${modVersions}"
    }

    // For 26+ versions, we take [0] + [1] + [2] (if present, otherwise 0)
    return "${parts[0]}.${parts[1]}.${parts.length > 2 ? parts[2] : 0}.${modVersions}"
}
